<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skins - NTS Radio Bootleg Media Player</title>
    <link rel="stylesheet" href="/src/picker.css" />
    <script type="module" src="/src/picker.ts"></script>
  </head>
  <body>
    <header>
      <label class="random"><input id="random" type="radio" name="mode" /> A random skin on every launch</label>
      <button id="folder" type="button">Open skins folder…</button>
      <select id="source" aria-label="Skins from">
        <option value="archive">archive.org</option>
        <option value="local">Local library</option>
      </select>
      <p id="status" role="status"></p>
    </header>
    <main>
      <ul id="skins" class="list"></ul>
      <ul id="local" class="list" hidden></ul>
      <aside>
        <div id="preview" role="status">Select a skin to see it here.</div>
        <button id="use" type="button" disabled>Use this skin</button>
      </aside>
    </main>
    <footer>
      Skins from the
      <a href="https://archive.org/details/windowsmediaplayerskinsarchive" data-link>Windows Media Player Skins Archive</a>
      on archive.org, made by their authors. This player is unofficial. Enjoying NTS?
      <a href="https://www.nts.live/supporters" data-link>Support them</a>.
    </footer>
  </body>
</html>
