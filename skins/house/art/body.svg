<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="420" height="232" viewBox="0 0 420 232">
  <!-- The house skin's body: a dial on the left, a capsule with the display
       and the controls, and the playlist drawer under it. #FF00FF is cut
       away (the view's clippingColor). The silhouette is drawn with crisp
       edges in the outline colour, and everything inside it is inset by at
       least 1.5 px, so no smoothed edge ever blends into the key colour. -->
  <defs>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46616d"/>
      <stop offset="0.5" stop-color="#2a3e47"/>
      <stop offset="1" stop-color="#17232a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#4f6c78"/>
      <stop offset="0.65" stop-color="#2a3e47"/>
      <stop offset="1" stop-color="#162127"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f2"/>
      <stop offset="0.35" stop-color="#97a3a8"/>
      <stop offset="0.55" stop-color="#f4f6f7"/>
      <stop offset="1" stop-color="#6f7c82"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22323a"/>
      <stop offset="1" stop-color="#121b20"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8c066"/>
      <stop offset="1" stop-color="#e48e2c"/>
    </linearGradient>
    <linearGradient id="lcdShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1e00" stop-opacity="0.35"/>
      <stop offset="0.14" stop-color="#3a1e00" stop-opacity="0"/>
    </linearGradient>
    <rect id="tick" x="83" y="14" width="2" height="5" rx="1"/>
    <rect id="majorTick" x="82.5" y="13" width="3" height="7" rx="1.5"/>
  </defs>

  <g inkscape:groupmode="layer" id="key" inkscape:label="Key colour">
    <rect width="420" height="232" fill="#ff00ff"/>
  </g>

  <g inkscape:groupmode="layer" id="silhouette" inkscape:label="Silhouette" fill="#0a1114" shape-rendering="crispEdges">
    <circle cx="84" cy="92" r="80"/>
    <rect x="100" y="28" width="314" height="128" rx="30"/>
    <rect x="180" y="136" width="216" height="90" rx="12"/>
  </g>

  <g inkscape:groupmode="layer" id="drawer" inkscape:label="Playlist drawer">
    <rect x="181.5" y="137.5" width="213" height="87" rx="10.5" fill="url(#drawer)"/>
    <rect x="188" y="163" width="200" height="56" rx="5" fill="#40575f"/>
    <rect x="188" y="162" width="200" height="56" rx="5" fill="#0d1316"/>
    <g fill="#0a1114">
      <rect x="276" y="219" width="24" height="2" rx="1"/>
    </g>
    <rect x="276" y="221" width="24" height="1" fill="#3a4f58"/>
    <rect x="180" y="154" width="216" height="10" fill="url(#shadow)"/>
  </g>

  <g inkscape:groupmode="layer" id="capsule" inkscape:label="Capsule">
    <rect x="101.5" y="29.5" width="311" height="125" rx="28.5" fill="url(#capsule)"/>
    <rect x="102.5" y="30.5" width="309" height="123" rx="27.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
  </g>

  <g inkscape:groupmode="layer" id="dial" inkscape:label="Dial">
    <circle cx="84" cy="92" r="78.5" fill="url(#disc)" stroke="#0a1114" stroke-width="1"/>
    <circle cx="84" cy="92" r="77.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
    <g fill="#a9bcc4" fill-opacity="0.55">
      <use href="#tick" transform="rotate(30 84 92)"/>
      <use href="#tick" transform="rotate(60 84 92)"/>
      <use href="#tick" transform="rotate(120 84 92)"/>
      <use href="#tick" transform="rotate(150 84 92)"/>
      <use href="#tick" transform="rotate(210 84 92)"/>
      <use href="#tick" transform="rotate(240 84 92)"/>
      <use href="#tick" transform="rotate(300 84 92)"/>
      <use href="#tick" transform="rotate(330 84 92)"/>
    </g>
    <g fill="#c7d4d9" fill-opacity="0.75">
      <use href="#majorTick" transform="rotate(90 84 92)"/>
      <use href="#majorTick" transform="rotate(180 84 92)"/>
      <use href="#majorTick" transform="rotate(270 84 92)"/>
    </g>
    <use href="#majorTick" fill="#f5a540"/>
    <circle cx="84" cy="92" r="60" fill="none" stroke="url(#metal)" stroke-width="12"/>
    <circle cx="84" cy="92" r="66" fill="none" stroke="#0a1114" stroke-opacity="0.7" stroke-width="1"/>
    <circle cx="84" cy="92" r="54" fill="#05080a" stroke="#0a1114" stroke-width="1"/>
  </g>

  <g inkscape:groupmode="layer" id="display" inkscape:label="Display">
    <rect x="168" y="39" width="230" height="64" rx="9" fill="#5a7480"/>
    <rect x="168" y="38" width="230" height="64" rx="9" fill="#0a1114"/>
    <rect x="171" y="41" width="224" height="58" rx="7" fill="url(#lcd)"/>
    <rect x="171" y="41" width="224" height="58" rx="7" fill="url(#lcdShade)"/>
    <rect x="180" y="70" width="206" height="1" fill="#a85c10" fill-opacity="0.45"/>
    <rect x="180" y="71" width="206" height="1" fill="#ffe2b0" fill-opacity="0.45"/>
  </g>

  <g inkscape:groupmode="layer" id="sockets" inkscape:label="Control sockets">
    <g fill="#587380">
      <circle cx="186" cy="127" r="13"/>
      <circle cx="220" cy="127" r="19"/>
      <circle cx="254" cy="127" r="13"/>
      <circle cx="284" cy="127" r="13"/>
      <circle cx="316" cy="127" r="12"/>
      <rect x="334" y="122" width="62" height="10" rx="5"/>
    </g>
    <g fill="#0a1114">
      <circle cx="186" cy="126" r="13"/>
      <circle cx="220" cy="126" r="19"/>
      <circle cx="254" cy="126" r="13"/>
      <circle cx="284" cy="126" r="13"/>
      <circle cx="316" cy="126" r="12"/>
      <rect x="334" y="121" width="62" height="10" rx="5"/>
    </g>
  </g>
</svg>
