# Temporary (ATA-230): builds main ("before") and this branch ("after") on a
# macOS runner and runs tools/macos/check.sh against each. The screenshots
# and results.txt are the artifact. Goes when the macOS CI job (ATA-229)
# lands.
name: macOS check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        if: matrix.side == 'before'
        with:
          ref: main
          path: before

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.side == 'before' && 'before/src-tauri' || 'src-tauri' }}

      - run: npm ci

      - name: Clippy and tests
        if: matrix.side == 'after'
        run: |
          npm run build
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        working-directory: ${{ matrix.side == 'before' && 'before' || '.' }}
        run: |
          [ "${{ matrix.side }}" = before ] && npm ci
          npx tauri build --debug --no-bundle

      - name: Check
        run: >
          tools/macos/check.sh
          ${{ matrix.side == 'before' && 'before/' || '' }}src-tauri/target/debug/nts-desktop-wmp
          out ${{ matrix.side == 'before' && 'shots' || 'full' }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-${{ matrix.side }}
          path: out
