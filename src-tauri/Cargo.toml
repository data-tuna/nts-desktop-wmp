[package]
name = "nts-desktop-wmp"
version = "0.2.1"
description = "Unofficial Windows Media Player-style desktop player for NTS Radio"
authors = ["data-tuna"]
license = "MIT"
repository = "https://github.com/data-tuna/nts-desktop-wmp"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "nts_desktop_wmp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for Window::add_child, which the skin webview rests on and semver
# does not cover: pinned to the minor version it was checked on (ATA-107).
tauri = { version = "~2.12.3", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Skins come from archive.org, which sends no CORS headers (ATA-112). The
# system's TLS (SChannel on Windows) keeps the binary small.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
md-5 = "0.11"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# No rustls or zip: SChannel, as for ureq; the signed artifact is the -setup.exe itself.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

# Size over speed: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
